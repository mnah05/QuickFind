name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v1.0.6)'
        required: true
        default: 'v1.0.6'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Universal macOS App
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Swift & Xcode Version
        run: |
          xcode-select -p
          swift --version

      - name: Package Universal Release (DMG & ZIP)
        run: sh scripts/package-release.sh

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: QuickFind ${{ steps.vars.outputs.tag }}
          files: |
            dist/QuickFind.dmg
            dist/QuickFind.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
